# render.yaml
# Finance Tracker API — Infrastructure as Code для Render.com

version: "1"

services:
  - type: web
    name: finance-tracker-api
    env: python
    region: frankfurt
    plan: free
    
    # 🛠️ Сборка
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head || true && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    
    # 🏥 Health Check
    healthCheckPath: /health
    healthCheckInterval: 30s
    
    # 🔄 Деплой
    autoDeploy: true
    branch: main
    
    # 🔐 Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      
      # ⚠️ DATABASE_URL нужно будет добавить ВРУЧНУЮ после создания БД
      - key: SECRET_KEY
        generateValue: true
      
      - key: ALGORITHM
        value: "HS256"
      
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      
      - key: LOG_LEVEL
        value: "INFO"