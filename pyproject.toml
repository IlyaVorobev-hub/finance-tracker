[project]
name = "finance-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy", "alembic", "aiosqlite",
  "pydantic-settings", "passlib[bcrypt]", "python-jose[cryptography]",
  "pandas", "scikit-learn", "streamlit", "plotly", "ruff", "pytest", "httpx"
]

[tool.ruff]
line-length = 100
target-version = "py310"